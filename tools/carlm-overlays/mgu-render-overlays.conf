# carlm-overlays: lets the Overlays strip (root client "carlm-overlays") be an overlay of mgu-render on
# iDrive 8: always shown, touch first, may claim the climate bar. mgu-render's own ExecStart plus that one setting
# (mgu-render 0.6.10 has overlay_apps empty); removed with the tool.
# Named zz-...: drop-ins apply in name order, so this ExecStart wins over another Overlays tool's (car-apps'
# iteriodev-overlays.conf); only one strip can be the overlay - uninstall that tool. Read at mgu-render's next start.
[Service]
ExecStart=
ExecStart=/var/opt/mgu-render/current/mgu-render -c /var/opt/mgu-render/current/mgu-render.conf -s overlay_apps=carlm-overlays
